[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-coder-utils"
dynamic = ["version"]
description = "Shared low-level Python helpers (subprocess, logging, fs) for the mcp-coder family of repos"
authors = [
    {name = "Marcus Jellinghaus", email = "Marcus@Jellinghaus.ch"}
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "structlog>=23.2.0",
    "python-json-logger>=3.3.0",
    "jsonschema>=4.20",
    "referencing>=0.28.4",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-xdist",
]

dev = [
    "mcp-coder-utils[test]",
    "mypy>=1.0.0",
    "types-jsonschema>=4.20",
    "pylint>=3.0.0",
    "ruff~=0.17.2",
    "vulture>=2.14",
    "import-linter>=2.0",
    "deptry>=0.25.1",
    "mcp-coder",
    "mcp-tools-py",
    "mcp-workspace",
]

[project.urls]
"Homepage" = "https://github.com/MarcusJellinghaus/mcp-coder-utils"
"Repository" = "https://github.com/MarcusJellinghaus/mcp-coder-utils"
"Bug Tracker" = "https://github.com/MarcusJellinghaus/mcp-coder-utils/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools_scm]
# Version is automatically determined from git tags
# Tag format: v0.1.0 -> version 0.1.0

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = ["--strict-markers", "--tb=short", "-n", "auto"]

[tool.mcp-tools-py]
# Formatter for run_format_code and mcp-coder workflows: ruff (import sorting + ruff format)
formatter = "ruff"

[tool.pylint.messages_control]
disable = [
    "C",       # conventions — not enabled in this project
    "R",       # refactor suggestions — not enabled in this project
    "W1203",   # logging-fstring-interpolation — project uses f-strings for readability
    "W0621",   # redefined-outer-name — standard pytest fixture pattern
    "W0511",   # fixme/TODO — informational only, not a quality gate
    "W0212",   # protected-access — legitimate in tests and controlled src usage
    "W0613",   # unused-argument — pytest fixtures injected by name
    "W0611",   # unused-import — owned by ruff F401 (pylint flags the X-as-X re-export convention)
    "W0404",   # reimported — reimports across test functions
    "W0718",   # broad-exception-caught — intentional catch-all around subprocess and logging boundaries
    "W0706",   # try-except-raise — explicit re-raise for clarity in error chains
    "W4903",   # deprecated-argument — tracked for future cleanup
]
enable = ["R0401"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["pytest.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = ["unreachable", "union-attr"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.format]

[tool.ruff.lint]
# preview needed for DOC rules (pydoclint)
preview = true
explicit-preview-rules = true   # preview rules fire only when selected by exact code
select = [
    "D",
    "ANN",
    # DOC rules are preview-only; with explicit-preview-rules they must be
    # listed by exact code — a bare "DOC" prefix silently enforces nothing.
    "DOC201", "DOC202", "DOC402", "DOC403", "DOC501", "DOC502",
    "SIM",
    # SIM905 is preview-only; see explicit-preview-rules note above.
    "SIM905",
    "E",
    "F",
    "C4", "B",
    "S",
    # PLW1510 only: the PL prefix would re-enable pylint's disabled R category (PLR09xx).
    "PLW1510",
    # PLE2502 bidirectional-unicode: covers bandit B613 (trojansource), which has no S port.
    "PLE2502",
    "UP",
    "I",
]
ignore = [
    "D107",  # missing docstring in __init__ method (redundant with class docstring)
    "ANN401",  # Any is correct at library/CLI boundaries; mypy strict covers the rest
    "E501",  # line length is owned by the formatter (ruff format); not re-checked here
    "S404",  # importing subprocess is this tool's core function
    "S603",  # subprocess without shell=True is the SAFE form; argv is internally built
]

[tool.ruff.lint.per-file-ignores]
# tests: assert is the pytest idiom (S101); S105/S106/S108 fire on fake
# credentials and "/tmp/..." literals used as test data, never opened.
"tests/**/*.py" = ["D", "DOC", "SIM117", "S101", "S105", "S106", "S108"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Dependency-declaration hygiene. Run as `deptry src`.
# src only: running it over tests/ yields DEP004 noise and no signal.
[tool.deptry]
known_first_party = ["mcp_coder_utils"]
# Extras holding dev-only packages: deptry exempts them from DEP002 and reports
# DEP004 if src/ imports them. deptry does not expand mcp-coder-utils[...] self-
# references, so each such extra is named explicitly.
optional_dependencies_dev_groups = ["dev", "test"]

[tool.mcp-coder.install-from-github]
# Installed WITHOUT deps (siblings — avoid downgrading shared deps)
packages-no-deps = [
    "mcp-coder @ git+https://github.com/MarcusJellinghaus/mcp_coder.git",
    "mcp-tools-py @ git+https://github.com/MarcusJellinghaus/mcp-tools-py.git",
    "mcp-workspace @ git+https://github.com/MarcusJellinghaus/mcp-workspace.git",
]
