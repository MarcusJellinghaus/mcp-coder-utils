version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    target-branch: "main"
    labels:
      - "dependencies"
      - "python"
    # Library: keep minimums as hard floors. Only touch a requirement when a
    # new release falls outside it (e.g. a <3 cap), never raise a >= floor.
    versioning-strategy: "increase-if-necessary"
    allow:
      - dependency-type: "all"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    target-branch: "main"
    labels:
      - "dependencies"
      - "CI"
    cooldown:
      default-days: 7
